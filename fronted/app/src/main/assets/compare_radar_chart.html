<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷达图对比</title>
    <script src="echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; }
        #chart { width: 100%; height: 200px; }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        var chart = echarts.init(document.getElementById('chart'));
        
        function setCompareRadarData(indicators, dataA, dataB) {
            var option = {
                legend: {
                    data: ['报告A', '报告B'],
                    bottom: 0,
                    textStyle: { color: '#666', fontSize: 11 }
                },
                radar: {
                    indicator: indicators,
                    radius: '55%',
                    center: ['50%', '45%'],
                    axisName: { color: '#666', fontSize: 10 },
                    splitArea: { areaStyle: { color: ['rgba(58,109,240,0.03)', 'rgba(58,109,240,0.06)'] } },
                    splitLine: { lineStyle: { color: '#e8e8e8' } },
                    axisLine: { lineStyle: { color: '#e8e8e8' } }
                },
                series: [{
                    type: 'radar',
                    data: [
                        {
                            value: dataA,
                            name: '报告A',
                            areaStyle: { color: 'rgba(58,109,240,0.25)' },
                            lineStyle: { color: '#3a6df0', width: 2 },
                            itemStyle: { color: '#3a6df0' }
                        },
                        {
                            value: dataB,
                            name: '报告B',
                            areaStyle: { color: 'rgba(255,107,53,0.2)' },
                            lineStyle: { color: '#FF6B35', width: 2 },
                            itemStyle: { color: '#FF6B35' }
                        }
                    ]
                }]
            };
            chart.setOption(option, true);
        }

        // 默认
        setCompareRadarData(
            [{name:'水分',max:100},{name:'油分',max:100},{name:'弹性',max:100},{name:'毛孔',max:100},{name:'肤色',max:100}],
            [85, 60, 75, 70, 80],
            [78, 65, 80, 55, 72]
        );
        
        window.addEventListener('resize', function() { chart.resize(); });
    </script>
</body>
</html>
