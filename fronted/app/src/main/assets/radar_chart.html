<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肤质雷达图</title>
    <script src="echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        var chart = echarts.init(document.getElementById('chart'));
        
        function buildRadarOption(indicators, data) {
            return {
                radar: {
                    indicator: indicators,
                    radius: '56%',
                    center: ['50%', '50%'],
                    axisNameGap: 5,
                    axisName: {
                        color: '#666',
                        fontSize: 10
                    },
                    splitArea: {
                        areaStyle: {
                            color: ['rgba(58, 109, 240, 0.05)', 'rgba(58, 109, 240, 0.1)']
                        }
                    },
                    splitLine: {
                        lineStyle: { color: '#e8e8e8' }
                    },
                    axisLine: {
                        lineStyle: { color: '#e8e8e8' }
                    }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: data,
                        name: '肤质评分',
                        areaStyle: {
                            color: 'rgba(58, 109, 240, 0.3)'
                        },
                        lineStyle: {
                            color: '#3a6df0',
                            width: 2
                        },
                        itemStyle: {
                            color: '#3a6df0'
                        }
                    }]
                }]
            };
        }
        
        function setRadarData(indicators, data) {
            var option = buildRadarOption(indicators, data);
            chart.setOption(option);
        }
        
        // 默认数据
        setRadarData(
            [
                { name: '水分', max: 100 },
                { name: '油分', max: 100 },
                { name: '弹性', max: 100 },
                { name: '毛孔', max: 100 },
                { name: '肤色', max: 100 }
            ],
            [85, 60, 75, 70, 80]
        );
        
        window.addEventListener('resize', function() {
            chart.resize();
        });
    </script>
</body>
</html>
