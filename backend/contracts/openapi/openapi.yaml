  /api/v1/skin-assessment-tasks:
    post:
      operationId: m3A01CreateSkinAssessmentTask
      tags: [M3-测肤任务与报告]
      summary: M3-A01 提交三视角测肤任务
      x-api-id: M3-A01
      x-implementation: contract-only
      x-error-codes: [INVALID_INPUT, UPLOAD_TOO_LARGE, UNSUPPORTED_IMAGE, AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, TASK_REPLACED, DEVICE_OCCUPIED, STOP_NOT_CONFIRMED, IDEMPOTENCY_CONTENT_CONFLICT, REQUEST_IN_PROGRESS, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：已认证云台（gimbal device session token）；APP 测肤不开放
        （APP token 调用返回 CALLER_NOT_ALLOWED）。multipart：metadata part
        （photoVersion/captureSessionId/consentEvidenceRef）+ `front`/`left`/
        `right` 三个图片二进制 part（三图合计 ≤32MiB 开发初值）。受理成功
        202 返回任务引用与 queued 状态；先校验云台身份与照片归属，再处理
        去重；云台控制的原护理执行未实际停止/收尾时拒绝（DEVICE_OCCUPIED /
        STOP_NOT_CONFIRMED），不自动停止护理。新任务受理与当前任务指针替换
        原子完成；旧请求重放返回原 taskId + replaced 语义，不返回旧结果、
        不恢复指针。缺失/格式失败不受理、不切指针。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, front, left, right]
              additionalProperties: false
              properties:
                metadata: { $ref: '#/components/schemas/M3A01Metadata' }
                front: { type: string, format: binary, description: 正面视角照片 }
                left: { type: string, format: binary, description: 左侧视角照片 }
                right: { type: string, format: binary, description: 右侧视角照片 }
            encoding:
              metadata:
                contentType: application/json
      responses:
        '202':
          description: 已受理（处理状态不等于图片已可用）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssessmentTaskAccepted' }
        '200':
          description: 同一逻辑请求重放（返回已受理任务，不重复建任务）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssessmentTaskAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
