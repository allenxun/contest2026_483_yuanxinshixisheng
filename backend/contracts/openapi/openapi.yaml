openapi: 3.0.3
info:
  title: AI 皮肤护理系统（openvela 竞赛 · 元心实习生队 contest2026_483_yuanxinshixisheng）后端 MVP 基础契约
  version: 0.1.0
  description: >-
    工程基础与公共契约（工作包 A）。MVP foundation contract — business
    endpoints are contract-only.


    本文件冻结两类接口：(1) 27 个业务 API（M1-A01…M5-A01，与
    backend/doc/后端API接口设计-V1-五模块与流程对应.md 一一对应，标记
    `x-implementation: contract-only`，由 B/C/D 业务包实现）；(2) 基础协议端点
    （`x-foundation: true`，不计入 27：手机号会话认证、云台设备会话、受控媒体
    读取），由 A 包 Java 基础实现。


    未实现的业务接口一律返回 HTTP 501 + 标准错误信封（code
    `NOT_IMPLEMENTED`），绝不伪造 200 假成功。


    公共契约规则（backend/doc/后端详细设计-V1-MVP.md 第 3、9、10 节）：

    - HTTP JSON 字段一律 camelCase；数据库/任务 payload 一律 snake_case。

    - 服务端资源 ID 为 UUID 字符串；bigint（N/K/revision/seq/计数）在 JSON
      中一律十进制字符串，pattern `^(0|[1-9][0-9]*)$`；schema_version 用 JSON 整数。

    - 时间为 RFC 3339 UTC（例如 2026-09-10T04:00:00Z）。

    - 每个响应（含错误、含 204）携带 X-Request-Id 头；每次 HTTP 尝试生成
      requestId（信封内），与 T13 稳定逻辑请求 ID 区分。

    - 成功信封 `{requestId, data, meta:{replayed, serverTime}}`（204 无响应
      体）；列表 `data = {items: [], nextCursor: string|null}`；错误信封
      `{requestId, error:{code, message, retryable, details}}`。

    - 分页：limit 默认 20、上限 100；cursor 绑定排序值+ID+筛选摘要，非法游标
      400 INVALID_INPUT；不默认返回总数。

    - 业务写接口（除 M2-A01 认证握手、M2-A02 心跳以 epoch/seq 去重外）要求
      `Idempotency-Key` 头，服务端走 T13（principal 作用域 =
      accountId+installationId 或 gimbalId）。相同键相同内容重放返回原结果
      （meta.replayed=true）；相同键不同内容 409
      IDEMPOTENCY_CONTENT_CONFLICT；处理中 409 REQUEST_IN_PROGRESS +
      Retry-After。payload_hash 规范化见
      backend/contracts/canonicalization.md（RFC 8785 JCS + SHA-256）。

    - multipart 上传：`metadata` part 为 application/json，图片为二进制
      part；无独立直传 OSS 接口。成员敏感数据与图片响应
      `Cache-Control: no-store`。

    - 认证头 `Authorization: Bearer …`；请求体不能声明自己是哪个账号/云台，
      主体身份一律由服务端从会话派生。APP 使用手机号会话签发的 APP session
      token；云台使用 `POST /api/v1/gimbal-sessions` 签发的 gimbal device
      session token。

    - 每个操作的 `x-error-codes` 列出该端点适用的业务错误码（DD 3.2 错误码
      表 + NOT_IMPLEMENTED）。
  contact:
    name: yuanxin MVP backend contracts
servers:
  - url: /
    description: 同源相对路径（生产经 Nginx HTTPS 入口转发到 Java Web）
  - url: http://127.0.0.1:8080
    description: 本地开发实例示例（Java web 默认端口；不是生产地址）
tags:
  - name: M1-成员身份与访问授权
  - name: M2-云台与微晶管理
  - name: M3-测肤任务与报告
  - name: M4-护理管理
  - name: M5-消息通知
  - name: foundation-auth
    description: 基础认证协议端点（不计入 27 个业务 API）
  - name: foundation-media
    description: 受控媒体读取基础协议端点（不计入 27 个业务 API）
  - name: foundation-system
    description: 系统级跨语言 E2E 验收桥端点（不计入 27 个业务 API）
security:
  - bearerAuth: []
paths:
  # ================= M1 成员身份与访问授权 =================
  /api/v1/member-access-grants:
    post:
      operationId: m1A01CreateMemberAccessGrant
      tags: [M1-成员身份与访问授权]
      summary: M1-A01 人脸授权查看本人资料
      x-api-id: M1-A01
      x-implementation: contract-only
      x-error-codes: [INVALID_INPUT, UPLOAD_TOO_LARGE, UNSUPPORTED_IMAGE, FACE_QUALITY_REJECTED, AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, GRANT_REVOKED, IDEMPOTENCY_CONTENT_CONFLICT, REQUEST_IN_PROGRESS, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP（Bearer = APP session token，手机号会话签发）。multipart：
        metadata part（capture + consentEvidenceRef）+ `face` 图片二进制
        part。成功 201 新建 active 关系；已存在 active 或幂等重放返回 200
        （meta.replayed）。不创建新成员、不授予他人查看权、不提供护理启动
        许可；无可靠匹配只返回“未能确认本人/暂无可关联资料”语义，不返回候选
        列表。旧请求指向已撤销关系返回 GRANT_REVOKED。图片保存/读取失败不得
        当作核验成功（DEPENDENCY_UNAVAILABLE / DEPENDENCY_TIMEOUT）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, face]
              additionalProperties: false
              properties:
                metadata:
                  $ref: '#/components/schemas/M1A01Metadata'
                face:
                  type: string
                  format: binary
                  description: 当前人脸采集图片（单图 ≤10MiB 开发初值）
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: 新授权关系建立成功
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheNoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemberAccessGrantResult' }
        '200':
          description: 已存在 active 关系或幂等重放（返回同一 grantId，不刷新核验有效性）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheNoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemberAccessGrantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/me/member-access-grants:
    get:
      operationId: m1A02ListMemberAccessGrants
      tags: [M1-成员身份与访问授权]
      summary: M1-A02 查询当前账号已有成员访问关系
      x-api-id: M1-A02
      x-implementation: contract-only
      x-error-codes: [INVALID_INPUT, AUTH_REQUIRED, SESSION_INVALID, RESOURCE_NOT_VISIBLE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP（APP session token）。仅返回当前账号尚未撤销（active）的
        查看关联；授权不自动过期；不提供全库成员检索；空列表为 items=[]。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列表页（data.items[].grantId 可用于 M1-A03 撤销）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheNoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemberAccessGrantListData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/me/member-access-grants/{grantId}:
    delete:
      operationId: m1A03RevokeMemberAccessGrant
      tags: [M1-成员身份与访问授权]
      summary: M1-A03 撤销当前账号与某成员查看关联
      x-api-id: M1-A03
      x-implementation: contract-only
      x-error-codes: [AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, IDEMPOTENCY_CONTENT_CONFLICT, REQUEST_IN_PROGRESS, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP 中已登录的关联所属账号（APP session token）。成功 204 无
        响应体（X-Request-Id 头仍返回）；同一账号重复撤销已撤销关联也返回
        204。他人 grant 返回 404 RESOURCE_NOT_VISIBLE。只撤查看关联，不删除
        成员/人脸档案/报告/护理记录。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  # ================= M2 云台与微晶管理 =================
  /api/v1/gimbal-sessions:
    post:
      operationId: m2A01CreateGimbalSession
      tags: [M2-云台与微晶管理, foundation-auth]
      summary: M2-A01 云台认证或恢复连接后重新认证（基础协议实现）
      x-api-id: M2-A01
      x-foundation: true
      x-implementation: foundation-auth
      x-error-codes: [INVALID_INPUT, AUTH_REQUIRED, SESSION_INVALID, IDEMPOTENCY_CONTENT_CONFLICT, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT]
      description: >-
        调用方：云台设备（无 Bearer；凭设备凭据证明，DeviceCredentialProvider
        适配端口）。验证设备凭据后签发云台设备会话 token（绑定
        gimbalId/credentialVersion/会话 ID）。不创建或改变云台归属；凭据失败
        不登记为可信在线；重复认证不创建护理执行。本端点按 .coordination/A
        decisions #7 由 A 包 Java 基础实现（薄控制器 + 隔离测试替身），同时
        占用 27 个业务 API 编号 M2-A01（“27 业务 + 6 基础”中它是唯一双属性
        端点，说明见 contracts/decisions-notes.md）。设备凭据不使用
        Idempotency-Key 缓存可重放的秘密凭据（DD M2-A01）；认证握手走提供方
        防重放协议。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GimbalSessionRequest' }
      responses:
        '200':
          description: 会话签发成功（不返回成员资料）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheNoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GimbalSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/gimbals/{gimbalId}/heartbeats:
    post:
      operationId: m2A02ReportGimbalHeartbeat
      tags: [M2-云台与微晶管理]
      summary: M2-A02 上报心跳和云台已知工作状态
      x-api-id: M2-A02
      x-implementation: contract-only
      x-error-codes: [INVALID_INPUT, AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, TASK_REPLACED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：已认证云台（gimbal device session token）。心跳去重/顺序依据
        为 body 内 observationEpoch/observationSeq（非 Idempotency-Key 头）：
        重复旧心跳不延长在线时间、不覆盖新状态。执行状态摘要可供对账，但不
        累计完成量、不自动创建执行、不仅凭心跳释放占用。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GimbalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GimbalHeartbeatRequest' }
      responses:
        '200':
          description: 接收确认 + 后端记录时间
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GimbalHeartbeatAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/gimbals/{gimbalId}/status:
    get:
      operationId: m2A03GetGimbalStatus
      tags: [M2-云台与微晶管理]
      summary: M2-A03 查询云台状态
      x-api-id: M2-A03
      x-implementation: contract-only
      x-error-codes: [AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP（绑定该云台的账号，APP session token）或已认证云台自身
        （gimbal device session token）。T03 单表读，按绑定账号或本云台裁剪；
        云台离线不代表微晶停止；不得伪装成云台当前实时状态。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GimbalId'
      responses:
        '200':
          description: 已知状态投影
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GimbalStatusView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/microcrystal-observations:
    post:
      operationId: m2A04ReportMicrocrystalObservation
      tags: [M2-云台与微晶管理]
      summary: M2-A04 登记已连接微晶的能力与状态观察
      x-api-id: M2-A04
      x-implementation: contract-only
      x-error-codes: [INVALID_INPUT, AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, IDEMPOTENCY_CONTENT_CONFLICT, REQUEST_IN_PROGRESS, UNSUPPORTED_CONTRACT, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP 或云台（各自 session token），携带 connectionProof（绑定
        控制端+微晶+当前连接；不接受仅序列号）。登记不等于首次绑定授权；不
        允许以请求体覆盖他人归属或执行占用；禁止以观察抢占 T07；同一能力
        版本重复上报不重复触发方案生成。能力具体参数名/单位必须来自已验证的
        微晶协议（契约未冻结，x-detail: skeleton）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrocrystalObservationRequest' }
      responses:
        '200':
          description: 登记受理
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MicrocrystalObservationAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '504': { $ref: '#/components/responses/DependencyTimeout' }
  /api/v1/microcrystals/{microcrystalId}/capabilities:
    get:
      operationId: m2A05GetMicrocrystalCapabilities
      tags: [M2-云台与微晶管理]
      summary: M2-A05 读取后端已登记微晶能力
      x-api-id: M2-A05
      x-implementation: contract-only
      x-error-codes: [AUTH_REQUIRED, SESSION_INVALID, CALLER_NOT_ALLOWED, RESOURCE_NOT_VISIBLE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, NOT_IMPLEMENTED]
      description: >-
        调用方：APP 或云台（各自 session token），携带合法 connectionProof /
        已验证连接上下文。能力存在不意味着微晶空闲或现场就绪；占用在执行
        申请时检查。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MicrocrystalId'
        - name: X-Connection-Proof
          in: header
          required: false
          schema: { type: string }
          description: >-
            连接证明；必填性取决于调用方上下文（云台当前连接可隐含）。证明
            放认证上下文/请求头，具体协议由设备团队冻结前为开发建议。
            x-detail: skeleton
      responses:
        '200':
          description: 已登记能力
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MicrocrystalCapabilitiesView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
