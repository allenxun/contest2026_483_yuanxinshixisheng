        统一 404 RESOURCE_NOT_VISIBLE（不泄露存在性，不返回内部
        bucket/key）。响应 no-store + X-Content-Type-Options: nosniff；
        不重定向至长效签名地址；本版可不支持 Range，请求不因此绕过鉴权。
        available ≠ 可访问；鉴权发生在读取时，已下载字节无法远程收回。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 图片二进制内容（实际图片 MIME）
