        code: { type: string, description: 短信验证码（不写日志） }
        installationId: { type: string, minLength: 1, maxLength: 128 }
        installBindingMaterial: { type: object, additionalProperties: true, nullable: true, description: 提供方要求的安装绑定材料（格式待定） }
    SessionRefreshRequest:
      type: object
      description: "基础协议输入：真实刷新凭据（名称/格式随选定会话协议，x-detail: skeleton）"
      x-detail: skeleton
      required: [refreshCredential]
      additionalProperties: false
      properties:
        refreshCredential: { type: string, description: 刷新凭据（不写日志；不得存明文于 T09/T13） }
        installationId: { type: string, minLength: 1, maxLength: 128, nullable: true }
    AppSession:
      type: object
      description: >-
        基础协议输出：会话凭据 + 本地 accountId。token 字段名为开发建议
        （不建会话存储表；不返回供应商内部诊断，x-detail: skeleton）。
      x-detail: skeleton
      required: [accountId, accessToken, tokenType, expiresAt]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid, description: 本地账号 ID（T14.id） }
        accessToken: { type: string, description: APP session token（后续 Bearer 使用） }
        refreshToken: { type: string, nullable: true, description: 轮换刷新凭据（提供方协议决定） }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { $ref: '#/components/schemas/Rfc3339Utc' }
    # ---------- Foundation system（echo-jobs） ----------
    SystemEchoJobRequest:
      type: object
      description: >-
        f06 输入：message（≤512，允许中文）、numbersAsStrings（≤32 项，
        bigint 十进制字符串）、jobId 可选客户端 UUID（作为 dedup_key 后缀，
        缺省由服务端生成）。未知字段拒绝。
      required: [message, numbersAsStrings]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 0, maxLength: 512 }
        numbersAsStrings:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/BigintString' }
        jobId: { allOf: [{ type: string, format: uuid }], nullable: true }
    SystemEchoJobAccepted:
      type: object
      description: f06 输出：受理/重放的任务标识（status 为投影当前状态；新入队为 queued）
      required: [jobId, dedupKey, status]
      additionalProperties: false
      properties:
        jobId: { type: string, format: uuid }
        dedupKey: { type: string, description: "system:echo:<uuid>（T12 唯一去重键）" }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
    SystemEchoJobView:
      type: object
      description: >-
        f07 输出：async_jobs 行投影；attemptCount/leaseRevision 为 bigint
        十进制字符串；finishedAt/lastError 未到终态时为 null。
      required: [jobId, status, attemptCount, leaseRevision, finishedAt, lastError]
      additionalProperties: false
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attemptCount: { $ref: '#/components/schemas/BigintString' }
        leaseRevision:
          # Strict OAS 3.0.3: nullable needs a local `type`; inline the pattern
          # (mirrors BigintString) instead of the allOf+$ref+nullable form.
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          nullable: true
          description: 租约代次（bigint 十进制字符串）；null 表示无租约
        finishedAt:
          # Strict OAS 3.0.3: inline type+nullable (no allOf+$ref+nullable).
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC 完成时间；未到终态为 null
        lastError:
          # Strict OAS 3.0.3: `nullable` only applies alongside `type` in the SAME
          # Schema Object, so this is inline (no allOf+$ref+nullable, which strict
          # consumers may reject for a legitimate `lastError: null`).
          type: object
          nullable: true
          description: >-
            Bounded, sanitized job-failure projection. Internal diagnostics (raw
            code, message, stack, retry_after_seconds) are NEVER projected;
            unknown/malformed codes normalize to reason=internal. Sanitization is
            by bounded projection, not truncation. null when there is no failure.
          required: [reason, retryable]
          additionalProperties: false
          properties:
            reason:
              type: string
              enum: [unsupported_contract, retry_limit_exceeded, handler_failed, internal]
            retryable: { type: boolean }
