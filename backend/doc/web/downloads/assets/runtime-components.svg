<rect x="1080.0" y="71" width="80" height="27" rx="3" fill="#fff"/><text x="1120" y="90" text-anchor="middle" font-size="17" fill="#77879a">测肤分析</text>
<rect x="1053.0" y="286" width="114" height="27" rx="3" fill="#fff"/><text x="1110" y="305" text-anchor="middle" font-size="17" fill="#77879a">生成候选方案</text>
<rect x="553.0" y="49" width="114" height="27" rx="3" fill="#fff"/><text x="610" y="68" text-anchor="middle" font-size="17" fill="#77879a">异常消息投递</text>
