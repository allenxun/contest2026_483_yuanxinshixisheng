<text x="132.5" y="433.0" text-anchor="middle" font-size="20" font-weight="600" fill="#203954">APP（Android）</text>
<text x="132.5" y="460.0" text-anchor="middle" font-size="16" font-weight="400" fill="#64758b">业务请求 / 接收通知</text>
</g>
