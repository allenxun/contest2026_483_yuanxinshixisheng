<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="965" viewBox="0 0 1570 965" role="img" aria-labelledby="title desc">
<title id="title">运行组件与通信</title>
<desc id="desc">APP 与云台位于左侧，通过 Nginx 访问中部的 Java Web 后端进程；异步 Worker 位于 Web 正上方。右侧是 PostgreSQL、OSS 与外部算法服务。APP 与云台在本地控制微晶。</desc>
<rect width="1570" height="965" fill="#ffffff"/>
<defs>
<marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2862c3"/></marker>
<marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#77879a"/></marker>
<marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#43846c"/></marker>
</defs>
