[project]
name = "llm-rag-application"
version = "0.1.0"
description = "RAG application with vector search"
requires-python = ">=3.10,<3.12"
dependencies = [
    "bcembedding==0.1.3",
    "charset-normalizer==3.2.0",
    "dataclass-wizard==0.22.3",
    "datasets==2.18.0",
    "fastapi==0.110.0",
    "FlagEmbedding==1.2.11",
    "httpx==0.27.0",
    "langchain==0.1.12",
    "langfuse==2.31.0",
    "langsmith==0.1.25",
    "modelscope>=1.20,<2",
    "nltk==3.8.1",
    "numpy==1.24.4",
    "openai==1.14.3",
    "peft==0.10.0",
    "pillow==10.2.0",
    "pydantic==2.6.4",
    "pgvector>=0.3,<1",
    "pymupdf==1.24.5",
    "python-docx==1.1.0",
    "python-dotenv>=1.0,<2",
    "python-multipart==0.0.9",
    "psycopg[binary]>=3.1,<4",
    "pyyaml==6.0.1",
    "ragas==0.1.7",
    "rapidocr-onnxruntime==1.3.15",
    "requests==2.31.0",
    "sentencepiece==0.2.0",
    "setuptools==68.2.2",
    "slowapi>=0.1.9,<0.2",
    "sqlalchemy==2.0.28",
    "sse-starlette==1.8.2",
    "streamlit==1.56.0",
    "torch==2.7.1",
    "tqdm==4.66.2",
    "transformers==4.37.1",
    "tritonclient[all]==2.36.0",
    "unstructured==0.14.3",
    "uvicorn==0.28.0",
    "wired-table-rec==0.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
