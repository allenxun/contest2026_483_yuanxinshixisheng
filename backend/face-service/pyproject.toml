[project]
name = "face-service"
version = "0.1.0"
description = "InsightFace-for-openvela: project-dedicated, isolated face service (extract / quality / 1:1 verify / namespaced subject store)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "insightface==0.7.3",
    "onnxruntime==1.24.4",
    "fastapi==0.135.3",
    "uvicorn>=0.44.0",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pillow>=12.2.0",
    "python-multipart>=0.0.24",
]

[project.optional-dependencies]
# Test-only deps. Tests NEVER import insightface/onnxruntime; the model layer is
# lazily imported so the whole app is importable and testable without the CV stack.
test = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
face-service = "face_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
